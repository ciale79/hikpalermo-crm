<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/shim.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<title>HIK Palermo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,500..800;1,75..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: sidebar di navigazione fissa + area di lavoro; su telefono la navigazione diventa una barra orizzontale. Tono tecnico: inchiostro blu-ardesia, accento rosso. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --line:#D3DAE1; --line-2:#E3E8ED;
  --ink:#14212C; --ink-2:#45576A; --ink-3:#768797;
  --accent:#C8102E; --accent-ink:#FFFFFF; --accent-soft:#FADDE1;
  --ok:#2D7A4E; --warn:#A8701A; --bad:#8E1D45; --info:#2D68AE; --violet:#6A55B0;
  --t-explorer:#647384; --t-silver:#8593A0; --t-gold:#B08025; --t-platinum:#4F7A93; --t-diamond:#2478B5;
  --side:#14212C; --side-ink:#C9D4DD; --side-ink-2:#8798A7; --side-hover:#1E2F3D; --side-accent:#E8384F;
  --shadow:0 1px 2px rgba(20,33,44,.06),0 8px 24px rgba(20,33,44,.08);
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px; --font-digit:"Share Tech Mono",ui-monospace,"SFMono-Regular",monospace; --lcd:#18222B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#152029; --surface-2:#1B2833; --line:#2A3A47; --line-2:#22313D;
  --ink:#E4ECF2; --ink-2:#A6B5C2; --ink-3:#7A8B99;
  --accent:#FF5468; --accent-ink:#2B0006; --accent-soft:#4A1520;
  --ok:#55B67C; --warn:#D9A04A; --bad:#E07FA3; --info:#6EA3E0; --violet:#A694E6;
  --t-explorer:#93A2B1; --t-silver:#B4C0CA; --t-gold:#D9AA4E; --t-platinum:#7FAAC2; --t-diamond:#5BAEE8;
  --side:#0A1015; --side-ink:#C9D4DD; --side-ink-2:#7D8E9C; --side-hover:#15212A; --side-accent:#FF5468; --lcd:#05090C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#152029; --surface-2:#1B2833; --line:#2A3A47; --line-2:#22313D;
  --ink:#E4ECF2; --ink-2:#A6B5C2; --ink-3:#7A8B99;
  --accent:#FF5468; --accent-ink:#2B0006; --accent-soft:#4A1520;
  --ok:#55B67C; --warn:#D9A04A; --bad:#E07FA3; --info:#6EA3E0; --violet:#A694E6;
  --t-explorer:#93A2B1; --t-silver:#B4C0CA; --t-gold:#D9AA4E; --t-platinum:#7FAAC2; --t-diamond:#5BAEE8;
  --side:#0A1015; --side-ink:#C9D4DD; --side-ink-2:#7D8E9C; --side-hover:#15212A; --side-accent:#FF5468; --lcd:#05090C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-stretch:88%;letter-spacing:-.01em;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1rem}h4{font-size:.9rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink-3)}.soft{color:var(--ink-2)}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding-block:18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--font-display);font-stretch:80%;font-size:1.3rem;letter-spacing:.01em;color:#fff;font-weight:800}
.brand .hik{color:var(--side-accent)}
.brand b{font-style:italic}
.brand .sub{font-size:.72rem;color:var(--side-ink-2);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left;font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--side-hover)}
.nav button.on{background:var(--side-hover);color:#fff;box-shadow:inset 3px 0 0 var(--side-accent)}
.nav .cnt{margin-left:auto;font-size:.72rem;background:var(--side-accent);color:#fff;border-radius:10px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;font-size:.72rem;color:var(--side-ink-2);padding:0 8px;display:flex;flex-direction:column;gap:4px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top h1{font-size:1.25rem;flex:0 0 auto}
.gsearch{position:relative;flex:1;max-width:460px;margin-left:auto}
.gsearch input[type=search]{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.gsearch>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.gs-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:70vh;overflow:auto;padding:6px;z-index:30}
.gs-drop .grp{padding:6px 8px 2px}
.gs-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;min-width:0}
.gs-item:hover,.gs-item.hl{background:var(--surface-2)}
.gs-item .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me{display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--surface-2)}
.avatar.sm{width:22px;height:22px}
.plate{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:.76rem;letter-spacing:.06em;font-weight:500;padding:1px 6px 1px 5px;border:1.5px solid var(--ink-2);border-left:6px solid #1F4FA8;border-radius:3px;background:var(--surface);color:var(--ink);white-space:nowrap}
.avatar.ini{display:inline-grid;place-items:center;font-size:.68rem;font-weight:600;color:var(--ink-2);border:1px solid var(--line)}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn .dot{position:absolute;top:4px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:.65rem;font-weight:600;display:grid;place-items:center;padding:0 4px}
.content{padding-block:20px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.banner{border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;font-size:.9rem}

/* primitives */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:16px;min-width:0}
.panel>h3,.panel-h{margin-bottom:10px}
.panel-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hp-fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.hp-fgrid>.full{grid-column:1/-1}
.hp-fgrid.dash{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.hp-fitem[data-k=map] svg{max-height:520px;width:100%}
.hp-tg{text-align:left;font:inherit;color:inherit;cursor:pointer;padding-bottom:10px}
.hp-tg:hover{border-color:var(--accent)}
.hp-tg-row{display:flex;align-items:flex-end;gap:10px;margin:-2px 0 -2px}
.hp-tg-g{display:block;line-height:0}
.hp-tg-num{font-family:var(--font-mono);font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1;padding-bottom:2px;font-variant-numeric:tabular-nums}
.hp-tg-dl{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line-2)}
.hp-captile,.hp-pill{cursor:pointer}
.hp-captile:hover,.hp-pill:hover{border-color:var(--accent)}
.hp-capnew{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:1px 8px;font:inherit;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap}
.hp-capnew:hover{border-color:var(--accent);color:var(--accent)}
.hp-capn{font-family:var(--font-display);font-stretch:85%;font-size:1.15rem;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hp-pill-d{display:flex;align-items:baseline;gap:8px}
.hp-pill-d b{font-family:var(--font-display);font-stretch:85%;font-size:2.1rem;font-weight:800;line-height:1;text-transform:capitalize;letter-spacing:-.01em}
.hp-pill-d small{color:var(--ink-3);font-size:.85rem;font-weight:600;text-transform:capitalize}
.hp-pill-b{display:flex;gap:10px;align-items:center;min-width:0;margin-top:2px}
.hp-pill-t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.hp-pill-t>.s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-pill-c{font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-pill-x{font-size:.76rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.hp-tg-g svg{width:120px;height:auto;max-width:100%}
@media (max-width:600px){.hp-tg-row{gap:6px;flex-wrap:wrap;align-items:center}.hp-tg-g svg{width:88px}.hp-tg-num{font-size:1.45rem}.hp-pill-d{flex-wrap:wrap;gap:0 6px}.hp-pill-d b{font-size:1.6rem}.hp-pill .thumb{display:none}.hp-capn{font-size:1rem}}
.hp-patflag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font:inherit;font-size:.66rem;font-weight:700;letter-spacing:.03em;padding:1px 8px;cursor:pointer;white-space:nowrap;border:1px solid color-mix(in srgb,var(--violet) 45%,transparent);color:var(--violet);background:transparent}
.hp-patflag .hp-patdot{width:7px;height:7px}
.hp-patflag.on{background:color-mix(in srgb,var(--violet) 14%,transparent);border-color:transparent}
.hp-patflag.off{opacity:0;border-style:dashed;transition:opacity .15s}
.hp-patflag.off .hp-patdot{background:transparent;border:1.5px solid var(--violet)}
tr:hover .hp-patflag.off,.hp-patflag.off:focus-visible,.hp-patflag.big.off{opacity:1}
@media (hover:none){.hp-patflag.off{opacity:.6}}
.hp-patflag.big{font-size:.8rem;padding:3px 11px;letter-spacing:0}
.hp-patflag:hover{border-color:var(--violet)}
.hp-evsw{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:0 0 auto}
.hp-evsw.on{box-shadow:0 0 0 2px var(--ink)}
.hp-evpal{position:absolute;z-index:20;top:28px;left:0;display:grid;grid-template-columns:repeat(5,22px);gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.hp-ootog.on{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent);background:color-mix(in srgb,var(--info) 8%,transparent)}
.hp-tg-si .hp-ootog.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.hp-cliaddr{margin-top:-6px}
.hp-cliaddr:empty{display:none}
.hp-qbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.hp-qb{display:flex;align-items:center;gap:12px;min-width:0;padding:14px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.hp-qb:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.hp-qb:active{transform:translateY(0)}
.hp-qi{flex:0 0 auto;display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.hp-qt{display:flex;flex-direction:column;min-width:0}
.hp-qt b{font-family:var(--font-display);font-stretch:90%;font-size:1.05rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-qt small{color:var(--ink-3);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-qb.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.hp-qb.pri .hp-qi{background:rgba(255,255,255,.18);color:#fff}
.hp-qb.pri small{color:rgba(255,255,255,.82)}
.hp-qb .hp-qt b{white-space:normal;overflow-wrap:anywhere}
@media (max-width:600px){.hp-qbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.hp-qb{padding:10px;gap:8px}.hp-qi{width:34px;height:34px}.hp-qt b{font-size:.95rem}}
.tag.hw{--c:#0E7C86;color:#0E7C86;border-color:color-mix(in srgb,#0E7C86 40%,transparent)}
.tag.mkt{color:var(--t-gold);border-color:color-mix(in srgb,var(--t-gold) 45%,transparent)}
.tag.hl{color:#1F6FB2;border-color:color-mix(in srgb,#1F6FB2 45%,transparent)}
.tag.hm{color:#B4532A;border-color:color-mix(in srgb,#B4532A 45%,transparent)}
.hp-nettag{font-size:.62rem;color:var(--violet);border-color:color-mix(in srgb,var(--violet) 45%,transparent)}
.hp-netsel{font-size:.78rem;padding:3px 6px}
.hp-itx{font-size:.72rem;color:var(--warn)}
.hp-pev{margin-top:16px;padding-top:12px;border-top:1px solid var(--line-2)}
.hp-pevc{font-size:.8rem;font-weight:600;flex-wrap:wrap}
.hp-pevc a{color:var(--ink)}
.hp-fgrid-bar{display:flex;justify-content:space-between;gap:10px;margin:-4px 0 -8px}
.hp-fitem{position:relative;min-width:0;transition:opacity .15s}
.hp-fitem>.panel,.hp-fitem>.grid2,.hp-fitem>.kpis{height:100%}
.hp-fitem>.panel{box-sizing:border-box}
.hp-fitem>.stack{height:100%}
.hp-fitem>.stack>.panel:last-child{flex:1}
.hp-fgrid.dash>.hp-fitem[data-k=cli]>.panel{display:flex;flex-direction:column}
.hp-fgrid.dash>.hp-fitem[data-k=cli]>.panel>.hp-pat{margin-top:auto}
.hp-fgrid.dash>.hp-fitem[data-k=cli]>.panel>.hb{flex:0 0 auto}
.hp-grip{position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;justify-content:center;width:44px;height:18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);cursor:grab;touch-action:none;opacity:0;transition:opacity .15s;padding:0}
.hp-fitem:hover>.hp-grip,.hp-grip:focus-visible,.hp-fitem.dragging>.hp-grip{opacity:1}
.hp-grip:hover{color:var(--accent);border-color:var(--accent)}
@media (hover:none){.hp-grip{opacity:.85}}
.hp-fitem.dragging{opacity:.55;outline:2px dashed var(--accent);outline-offset:4px;border-radius:var(--r)}
.hp-fitem.dragging>.hp-grip{cursor:grabbing}
body.hp-dragging{user-select:none;cursor:grabbing}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
input[type=text],input[type=search],input[type=number],input[type=email],input[type=url],input[type=date],input[type=time],input[type=datetime-local],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.75rem;color:var(--ink-2);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{max-width:280px}
.filters select{width:auto;max-width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--surface)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink);font-family:var(--font-display);font-stretch:88%;font-size:1.05rem}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
th.r,td.r{text-align:right}
.cell-t{display:flex;flex-direction:column;min-width:0}
.cell-t small{color:var(--ink-3)}

/* chips */
.tier{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.tier::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--c)}
.tier .l{opacity:.75;font-weight:500}
.t-explorer{--c:var(--t-explorer)}.t-silver{--c:var(--t-silver)}.t-gold{--c:var(--t-gold)}.t-platinum{--c:var(--t-platinum)}.t-diamond{--c:var(--t-diamond)}.t-none{--c:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;padding:2px 9px;border-radius:20px;color:var(--c,var(--ink-2));background:color-mix(in srgb,var(--c,var(--ink-3)) 13%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--ink-3))}
.s-opp{--c:var(--info)}.s-sop{--c:var(--violet)}.s-prog{--c:var(--violet)}.s-off{--c:var(--warn)}.s-tratt{--c:var(--warn)}.s-acq{--c:var(--ok)}.s-demo{--c:var(--t-gold)}.s-conf{--c:var(--ok)}.s-exec{--c:var(--t-platinum)}.s-chiusa{--c:var(--ink-3)}.s-persa{--c:var(--bad)}
.o-Bozza{--c:var(--ink-3)}.o-Inviata{--c:var(--warn)}.o-Accettata{--c:var(--ok)}.o-Rifiutata{--c:var(--bad)}.o-Scaduta{--c:var(--ink-3)}
.c-piena{--c:var(--ok)}.c-parziale{--c:var(--warn)}.c-da-verificare{--c:var(--info)}
.e-riunione{--c:var(--t-platinum)}.e-call{--c:var(--info)}.e-visita{--c:var(--ok)}.e-appuntamento{--c:var(--violet)}.e-sopralluogo{--c:var(--warn)}
.tag{font-family:var(--font-mono);font-size:.68rem;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.pro{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.tag.sol{border-color:color-mix(in srgb,var(--info) 45%,var(--line));color:var(--info)}
.tag.new{border-color:var(--ok);color:var(--ok)}
.rot{font-family:var(--font-mono);font-size:.7rem;width:20px;height:20px;border-radius:4px;display:inline-grid;place-items:center;font-weight:500;background:var(--surface-2);color:var(--ink-2)}
.rot.A{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--font-display);font-stretch:85%;font-size:1.65rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:.8rem;color:var(--ink-3)}

/* thumbs */
.thumb{display:inline-block;flex:0 0 auto;border-radius:6px;background-color:#fff;background-repeat:no-repeat;border:1px solid var(--line-2)}
.thumb.none{background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}

/* feed */
.feed{display:flex;flex-direction:column}
.feed-it{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;align-items:flex-start}
.feed-it:last-child{border-bottom:0}
.feed-it:hover{background:var(--surface-2)}
.feed-it .u{width:8px;height:8px;border-radius:50%;background:transparent;margin-top:10px;flex:0 0 auto}
.feed-it.unread .u{background:var(--bad)}
.feed-it .b{min-width:0;flex:1}
.feed-it .w{font-size:.75rem;color:var(--ink-3)}
.ev-li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.ev-li:last-child{border-bottom:0}
.ev-li .d{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;background:var(--surface-2);padding:4px 0;line-height:1.1}
.ev-li .d b{font-family:var(--font-display);font-size:1.2rem}
.ev-li .d small{font-size:.65rem;text-transform:uppercase;color:var(--ink-3);letter-spacing:.05em}
.ev-li .t{min-width:0}
.ev-li .t>div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-r{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:.85rem}
.bar-r .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar-r .tr i{display:block;height:100%;background:var(--c,var(--accent));border-radius:5px}
.matrix{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:6px;align-items:center;font-size:.85rem}
.matrix .h{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:center}
.matrix .c{text-align:center;padding:8px 0;border-radius:6px;background:color-mix(in srgb,var(--c) calc(var(--a,0)*1%),var(--surface-2));font-variant-numeric:tabular-nums;font-weight:600;cursor:pointer;border:0;color:var(--ink)}

/* map */
.map{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:8px}
.map .grid{stroke:var(--line);stroke-width:.6}
.map .city circle{fill:var(--ink-3)}
.map .city text{fill:var(--ink-3);font-size:13px;font-family:var(--font-body)}
.map .pt{cursor:pointer}
.map .pt circle{stroke:var(--surface);stroke-width:2}
.map .pt text{fill:var(--ink);font-size:14px;font-weight:600;paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.map .lbl{fill:var(--ink-3);font-size:11px;font-family:var(--font-mono)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,18,25,.45);z-index:100;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0}
.modal.wide{width:min(980px,100%)}
.modal.full{width:min(1280px,100%);height:100%}
.m-head{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.m-body{padding:16px 18px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:14px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.m-foot:empty{display:none}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;font-size:.9rem;animation:tin .25s ease-out}
.toast.bad{background:var(--bad);color:#fff}
.toast.live{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);cursor:pointer}
.toast .x{margin-left:auto;background:none;border:0;color:inherit;cursor:pointer;opacity:.7}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40;max-height:70vh;display:flex;flex-direction:column}
.pop .ph{padding:10px 14px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center}
.pop .pb{overflow:auto;padding:0 10px}

/* detail */
.dhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.dhead .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 14px;font-size:.9rem}
.dl dt{color:var(--ink-3)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-size:.72rem;color:var(--ink-3);margin-left:4px}
.totals{display:flex;gap:28px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-end;padding:14px 16px;background:var(--surface-2);border-radius:10px}
.totals div{display:flex;flex-direction:column;align-items:flex-end}
.totals b{font-family:var(--font-display);font-stretch:85%;font-size:1.35rem;font-variant-numeric:tabular-nums}
.totals .big b{font-size:1.75rem;color:var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line-2);border-radius:8px;padding:8px;min-width:0;background:var(--surface)}
.file .fi{width:44px;height:44px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto;overflow:hidden;font-family:var(--font-mono);font-size:.7rem;color:var(--ink-2)}
.file .fi img{width:100%;height:100%;object-fit:cover}
.file .t{min-width:0;flex:1}
.file .t a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;text-decoration:none;color:var(--ink)}
.note{border-left:3px solid var(--line);padding:4px 0 4px 12px}
.note .w{font-size:.75rem;color:var(--ink-3)}
.note p{white-space:pre-wrap}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--line-2);gap:1px}
.cal .dh{background:var(--surface);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:6px 8px;font-weight:600}
.cal .day{background:var(--surface);min-height:104px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .day:hover{background:var(--surface-2)}
.cal .day.out{background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.cal .day.out .n{color:var(--ink-3)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .n{font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.cal .day.today .n{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 6px;align-self:flex-start}
.cal .ch{font-size:.72rem;padding:1px 5px;border-radius:3px;background:color-mix(in srgb,var(--c) 15%,transparent);border-left:3px solid var(--c);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}
.cal .more{font-size:.7rem;color:var(--ink-3)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px;cursor:pointer;font-size:.85rem;background:var(--surface)}
.person input{display:none}
.person.on{border-color:var(--accent);background:var(--accent-soft)}

/* articles */
.art{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-2);cursor:pointer}
.art:hover{background:var(--surface-2)}
.art .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.art .t .c{font-family:var(--font-mono);font-weight:500}
.art .t .d{color:var(--ink-2);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.art .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.art .p{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.art .p b{font-variant-numeric:tabular-nums;font-size:1rem}
.picker{position:relative}
.picker .gs-drop{max-height:360px}
.ln-in{width:74px !important;text-align:right;padding:5px 7px !important}
.ln-in.auto{color:var(--accent);font-weight:600}
.cap-log{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;max-height:180px;overflow:auto;white-space:pre-wrap}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.disc-tbl td,.disc-tbl th{padding:6px 8px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.8rem;color:var(--ink-3)}

/* misuratore digitale di avanzamento: display LCD scuro in entrambi i temi, LED dal rosso al verde */
.meter{display:flex;align-items:center;gap:8px;background:var(--lcd);border-radius:6px;padding:5px 8px;min-width:0;width:100%;max-width:100%;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.meter .segs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;flex:1;min-width:0}
.meter .sg{height:12px;border-radius:1.5px;background:hsl(var(--h) 30% 18%)}
.meter .sg.on{background:hsl(var(--h) 85% 50%);box-shadow:0 0 6px hsl(var(--h) 90% 50% / .55)}
.meter .mv{font-family:var(--font-digit);font-size:1rem;color:hsl(var(--h) 90% 58%);min-width:4.2ch;text-align:right;letter-spacing:.04em;text-shadow:0 0 6px hsl(var(--h) 90% 50% / .5);font-variant-numeric:tabular-nums}
.meter.sm{width:150px;padding:4px 6px}.meter.sm .sg{height:9px}.meter.sm .mv{font-size:.85rem}
.meter.lg{padding:10px 14px;gap:14px}.meter.lg .sg{height:24px;border-radius:2px}.meter.lg .mv{font-size:2.1rem}
.meter.lost .sg{background:hsl(0 0% 20%);box-shadow:none}
.phases{display:flex;justify-content:space-between;gap:6px;font-size:.72rem;color:var(--ink-3);flex-wrap:wrap;text-transform:uppercase;letter-spacing:.05em}
.phases .on{color:var(--ink);font-weight:600}
.tag.tc-gara{border-color:var(--warn);color:var(--warn)}.tag.tc-mepa{border-color:var(--info);color:var(--info)}.tag.tc-affidamento{border-color:var(--violet);color:var(--violet)}
/* mini cruscotto laterale: display LCD, scuri in entrambi i temi */
.side{overflow-y:auto}
#sideWid{padding:0 2px}
.sidewid{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;background:#0B1217;border:1px solid #22313D}
.qrow{display:flex;align-items:center;gap:4px}
.qrow .yl{font-family:var(--font-digit);color:#CFD8DF;font-size:.9rem;padding:0 1px}
.qrow .qy{background:none;border:0;color:#8798A7;cursor:pointer;padding:0 3px;font-size:1rem;line-height:1}
.qb{flex:1;background:#18242D;border:1px solid #2B3B48;color:#9FB0BE;border-radius:5px;padding:3px 0;font-family:var(--font-digit);font-size:.82rem;cursor:pointer;min-width:0}
.qb:hover{color:#fff}
.qb.on{background:var(--side-accent);border-color:var(--side-accent);color:#fff}
.qb.qt{color:#FFC857;border-color:#6B5520;background:#231C0B}.qb.qt.on{background:#FFC857;border-color:#FFC857;color:#231C0B}
.lcds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.lcd{background:#05090C;border-radius:6px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 1px 3px rgba(0,0,0,.7);cursor:default}
.lcd b{font-family:var(--font-digit);font-size:1.5rem;line-height:1;color:hsl(var(--h) 85% 58%);text-shadow:0 0 8px hsl(var(--h) 90% 50% / .55);font-weight:400;font-variant-numeric:tabular-nums}
.lcd span{font-size:.55rem;letter-spacing:.1em;color:#7D8E9C;margin-top:4px}
.qcap{font-size:.62rem;color:#7D8E9C;letter-spacing:.04em}
.sales{display:flex;flex-direction:column;gap:4px;border-top:1px solid #22313D;padding-top:8px}
.sales .sh{font-size:.6rem;letter-spacing:.1em;color:#8798A7}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.srow span{font-size:.62rem;letter-spacing:.1em;color:#9FB0BE}
.srow b{font-family:var(--font-digit);font-weight:400;color:#FFC857;font-size:1.1rem;text-shadow:0 0 6px rgba(255,190,70,.4)}
.sbar{height:5px;background:#18242D;border-radius:3px;overflow:hidden}.sbar i{display:block;height:100%;background:var(--side-accent)}
.ach{display:flex;flex-direction:column;gap:3px;margin:-1px 0 3px}.abar{height:6px;background:#18242D;border-radius:3px;overflow:hidden}.abar i{display:block;height:100%;background:hsl(var(--h) 80% 50%);box-shadow:0 0 6px hsl(var(--h) 90% 50% / .5)}.ach span{font-family:var(--font-digit);font-size:.68rem;color:#9FB0BE;letter-spacing:.04em}.ach .apct b{font-weight:400;font-size:.82rem;color:hsl(var(--h) 90% 58%);text-shadow:0 0 6px hsl(var(--h) 90% 50% / .5)}
.srow.sub{padding-left:8px}.srow.sub span{font-size:.58rem;color:#7D8E9C}.srow.sub b{font-size:.92rem}
.sales.empty{font-size:.64rem;color:#7D8E9C;letter-spacing:.04em}
.m-only{display:none}
/* codice esploso */
.expl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:.88rem}
.expl .xr{display:contents}
.expl .xs{font-family:var(--font-mono);font-weight:500;color:var(--accent);white-space:nowrap}
.expl .xr.nd .xs{color:var(--ink-3)}.expl .xr.nd span:last-child{color:var(--ink-3);font-style:italic}
.xstrip{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.xseg{font-family:var(--font-mono);font-size:.95rem;padding:3px 7px;border-radius:4px;background:var(--surface);border:1px solid var(--line);cursor:help}
.xseg.nd{border-style:dashed;color:var(--ink-3)}
details.panel>summary{cursor:pointer;list-style:revert}
/* articoli: griglia, pagine, confronto */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;min-width:0}
.acard:hover{border-color:var(--ink-3)}
.acard .img{display:grid;place-items:center;background:#fff;border-radius:8px;padding:6px}
.acard .img .thumb{border:0}
.acard .c{font-family:var(--font-mono);font-weight:500;overflow-wrap:anywhere}
.acard .d{font-size:.83rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sap{font-size:.75rem;color:var(--ink-3)}
.cmpchk{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;color:var(--ink-2);cursor:pointer;padding:2px 7px;border-radius:5px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.cmpchk input{margin:0}
.cmpchk.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px);flex-wrap:wrap}
.tray-it{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--surface) 12%,transparent);border-radius:7px;padding:3px 6px;font-size:.8rem}
.tray-it .x{background:none;border:0;color:inherit;cursor:pointer;opacity:.7}
table.cmp th[scope=row]{text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--ink-2);background:var(--surface-2);white-space:nowrap;vertical-align:top;position:sticky;left:0;z-index:1}
table.cmp td{vertical-align:top;min-width:230px}
table.cmp tr.dif td{background:color-mix(in srgb,var(--warn) 10%,transparent)}

function searchCat(q,f={}){
  const toks=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);const qn=norm(q);const out=[];const isInt=f.src!==''&&f.src!=null&&SRC[+f.src]&&SRC[+f.src].int;

    let sc=0,ok=true;
